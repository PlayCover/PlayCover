name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            /Applications/Xcode_27.2.app
            /Applications/Xcode_27.2_beta_2.app
            /Applications/Xcode_27.1.app
            /Applications/Xcode_27.1_Release_Candidate.app
            /Applications/Xcode_27.app
            /Applications/Xcode.app
          )
          selected=""
          for app in "${candidates[@]}"; do
            if [ -d "$app" ]; then
              selected="$app"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo "error: no Xcode 27 installation found" >&2
            ls /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          echo "Using $selected"
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version

      # Pinned: a newer SwiftLint adds rules and would fail commits that did not change.
      - name: Install SwiftLint
        shell: bash
        env:
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -oq "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version

      - name: SwiftLint
        shell: bash
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Build & Test
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project PlayCover.xcodeproj \
            -scheme PlayCover \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES
